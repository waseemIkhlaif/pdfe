# Initial active versions. A setting not listed here starts at its default from the registry.
config:
  - { key: fees.default_minor, value: 0 }
  - { key: limits.transfer_max_minor, value: 500000 }
  - { key: fx.spread_bps, value: 0 }
mock_hub:
