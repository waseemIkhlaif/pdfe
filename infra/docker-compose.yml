# Local stack. Run from the repository root:  docker compose --env-file .env -f infra/docker-compose.yml up -d --build --wait
# `pnpm dev:all` does this and then runs the smoke test. Secrets come from .env (written by `pnpm bootstrap`).
name: pdfe

x-app-env: &app-env
  APP_MODE: DEMO
  INTERNAL_HOSTS: postgres,redis,keycloak,mock-hub,api,worker,lgtm,localhost,127.0.0.1
  REDIS_URL: redis://redis:6379
  # Traces, metrics and logs of api, worker and mock-hub go to the collector in the lgtm container.
  OTEL_EXPORTER_OTLP_ENDPOINT: http://lgtm:4318
  # Shared by the api (which sends it) and the mock hub (which checks it). A development .env written before this existed
  # has none: the fallback is a fixed synthetic value, harmless on the internal network (the control endpoint is not published).
  SCENARIO_TOKEN: ${SCENARIO_TOKEN:-local-demo-scenario-token}

services:
  postgres:
    networks: [app]
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?run pnpm bootstrap first}
      MIGRATOR_PASSWORD: ${MIGRATOR_PASSWORD:?run pnpm bootstrap first}
      APP_ROLE_PASSWORD: ${APP_ROLE_PASSWORD:?run pnpm bootstrap first}
      READONLY_PASSWORD: ${READONLY_PASSWORD:?run pnpm bootstrap first}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d pdfe']
      interval: 3s
      timeout: 3s
      retries: 30

  redis:
    networks: [app]
    image: redis:7
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 3s
      timeout: 3s
      retries: 30

  migrate:
    networks: [app]
    build:
      context: ..
      dockerfile: infra/docker/node-app.Dockerfile
      target: migrate
      args: { APP: platform-core }
    environment:
      MIGRATOR_DATABASE_URL: postgres://migrator_role:${MIGRATOR_PASSWORD}@postgres:5432/pdfe
    depends_on:
      postgres: { condition: service_healthy }
    restart: 'no'

  # Identity provider for the demo realm `pdfe-demo` (ADR-010). The realm is code: infra/keycloak/realm-pdfe-demo.json.
  # KC_HOSTNAME fixes the issuer to the public address, so tokens carry the same `iss` for browsers and for the
  # API, which reaches Keycloak by its service name on the internal network.
  # Grafana, Loki, Tempo and Prometheus in one container (grafana/otel-lgtm). It receives the services' OTLP data on the
  # internal network, and reads the audit trail through readonly_role. Grafana is published through the gateway on
  # localhost:3000; anonymous access is the image's default and is fine for a synthetic local demo.
  lgtm:
    image: grafana/otel-lgtm:0.41.0
    networks: [app]
    environment:
      READONLY_PASSWORD: ${READONLY_PASSWORD:?run pnpm bootstrap first}
    volumes:
      - ./grafana/provisioning/datasources/pdfe.yaml:/otel-lgtm/grafana/conf/provisioning/datasources/pdfe.yaml:ro
      - ./grafana/provisioning/dashboards/pdfe.yaml:/otel-lgtm/grafana/conf/provisioning/dashboards/pdfe.yaml:ro
      - ./grafana/dashboards:/pdfe-dashboards:ro
    depends_on:
      postgres: { condition: service_healthy }
    healthcheck:
      test: ['CMD-SHELL', 'curl -sf http://127.0.0.1:3000/api/health | grep -q ok']
      interval: 5s
      timeout: 5s
      retries: 40
      start_period: 40s

  keycloak:
    image: quay.io/keycloak/keycloak:26.8.2
    networks: [app]
    command: ['start-dev', '--import-realm']
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-demo-admin-synthetic}
      KC_HOSTNAME: http://localhost:8080
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: 'true'
      KC_HTTP_ENABLED: 'true'
      KC_HEALTH_ENABLED: 'true'
    volumes:
      - ./keycloak/realm-pdfe-demo.json:/opt/keycloak/data/import/realm-pdfe-demo.json:ro
      - ./keycloak/themes/pdfe:/opt/keycloak/themes/pdfe:ro
    healthcheck:
      # The image has no curl: speak HTTP to the management port with bash.
      test:
        - CMD-SHELL
        - 'exec 3<>/dev/tcp/127.0.0.1/9000 && printf "GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n" >&3 && grep -q "UP" <&3'
      interval: 5s
      timeout: 5s
      retries: 40
      start_period: 30s

  mock-hub:
    networks: [app]
    build:
      context: ..
      dockerfile: infra/docker/node-app.Dockerfile
      target: service
      args: { APP: mock-hub }
    environment:
      <<: *app-env
      PORT: '4100'
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://localhost:4100/mock/bank/ping').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    networks: [app]
    build:
      context: ..
      dockerfile: infra/docker/node-app.Dockerfile
      target: service
      args: { APP: api }
    environment:
      <<: *app-env
      PORT: '4000'
      ADAPTERS_CONFIG: /app/infra/adapters.demo.json
      MOCK_HUB_URL: http://mock-hub:4100
      # An empty database is seeded from this scenario at start (the demo users must exist before anyone can sign in).
      SEED_ON_EMPTY: baseline:v1:42
      OIDC_ISSUER: http://keycloak:8080/realms/pdfe-demo
      OIDC_PUBLIC_ISSUER: http://localhost:8080/realms/pdfe-demo
      DATABASE_URL: postgres://app_role:${APP_ROLE_PASSWORD}@postgres:5432/pdfe
    volumes:
      - ./adapters.demo.json:/app/infra/adapters.demo.json:ro
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }
      mock-hub: { condition: service_healthy }
      keycloak: { condition: service_healthy }
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://localhost:4000/v1/health').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 20

  worker:
    networks: [app]
    build:
      context: ..
      dockerfile: infra/docker/node-app.Dockerfile
      target: service
      args: { APP: worker }
    environment:
      <<: *app-env
      DATABASE_URL: postgres://app_role:${APP_ROLE_PASSWORD}@postgres:5432/pdfe
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }

  web-consumer:
    networks: [app]
    build:
      context: ..
      dockerfile: infra/docker/node-app.Dockerfile
      target: web
      args: { APP: web-consumer }
    environment:
      PORT: '3001'
      HOSTNAME: 0.0.0.0
      API_BASE_URL: http://api:4000
      APP_BASE_URL: http://localhost:3001
      OIDC_ISSUER: http://keycloak:8080/realms/pdfe-demo
      OIDC_PUBLIC_ISSUER: http://localhost:8080/realms/pdfe-demo
      OIDC_CLIENT_ID: web-consumer
      # Cookies are shared across ports on localhost, so each app needs its own cookie name.
      SESSION_COOKIE_NAME: pdfe_session_web_consumer
      OIDC_CLIENT_SECRET: demo-secret-web-consumer
      SESSION_SECRET: ${SESSION_SECRET:-demo-session-secret-synthetic-do-not-reuse-0000}
    depends_on:
      api: { condition: service_healthy }
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://localhost:3001/ar/sign-in').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 20

  web-merchant:
    networks: [app]
    build:
      context: ..
      dockerfile: infra/docker/node-app.Dockerfile
      target: web
      args: { APP: web-merchant }
    environment:
      PORT: '3002'
      HOSTNAME: 0.0.0.0
      API_BASE_URL: http://api:4000
      APP_BASE_URL: http://localhost:3002
      OIDC_ISSUER: http://keycloak:8080/realms/pdfe-demo
      OIDC_PUBLIC_ISSUER: http://localhost:8080/realms/pdfe-demo
      OIDC_CLIENT_ID: web-merchant
      # Cookies are shared across ports on localhost, so each app needs its own cookie name.
      SESSION_COOKIE_NAME: pdfe_session_web_merchant
      OIDC_CLIENT_SECRET: demo-secret-web-merchant
      SESSION_SECRET: ${SESSION_SECRET:-demo-session-secret-synthetic-do-not-reuse-0000}
    depends_on:
      api: { condition: service_healthy }
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://localhost:3002/ar/sign-in').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 20

  web-business:
    networks: [app]
    build:
      context: ..
      dockerfile: infra/docker/node-app.Dockerfile
      target: web
      args: { APP: web-business }
    environment:
      PORT: '3003'
      HOSTNAME: 0.0.0.0
      API_BASE_URL: http://api:4000
      APP_BASE_URL: http://localhost:3003
      OIDC_ISSUER: http://keycloak:8080/realms/pdfe-demo
      OIDC_PUBLIC_ISSUER: http://localhost:8080/realms/pdfe-demo
      OIDC_CLIENT_ID: web-business
      # Cookies are shared across ports on localhost, so each app needs its own cookie name.
      SESSION_COOKIE_NAME: pdfe_session_web_business
      OIDC_CLIENT_SECRET: demo-secret-web-business
      SESSION_SECRET: ${SESSION_SECRET:-demo-session-secret-synthetic-do-not-reuse-0000}
    depends_on:
      api: { condition: service_healthy }
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://localhost:3003/ar/sign-in').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 20

  web-console:
    networks: [app]
    build:
      context: ..
      dockerfile: infra/docker/node-app.Dockerfile
      target: web
      args: { APP: web-console }
    environment:
      PORT: '3004'
      HOSTNAME: 0.0.0.0
      API_BASE_URL: http://api:4000
      APP_BASE_URL: http://localhost:3004
      OIDC_ISSUER: http://keycloak:8080/realms/pdfe-demo
      OIDC_PUBLIC_ISSUER: http://localhost:8080/realms/pdfe-demo
      OIDC_CLIENT_ID: web-console
      # Cookies are shared across ports on localhost, so each app needs its own cookie name.
      SESSION_COOKIE_NAME: pdfe_session_web_console
      OIDC_CLIENT_SECRET: demo-secret-web-console
      SESSION_SECRET: ${SESSION_SECRET:-demo-session-secret-synthetic-do-not-reuse-0000}
    depends_on:
      api: { condition: service_healthy }
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://localhost:3004/ar/sign-in').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 20

  web-investor:
    networks: [app]
    build:
      context: ..
      dockerfile: infra/docker/node-app.Dockerfile
      target: web
      args: { APP: web-investor }
    environment:
      PORT: '3005'
      HOSTNAME: 0.0.0.0
      API_BASE_URL: http://api:4000
      APP_BASE_URL: http://localhost:3005
      OIDC_ISSUER: http://keycloak:8080/realms/pdfe-demo
      OIDC_PUBLIC_ISSUER: http://localhost:8080/realms/pdfe-demo
      OIDC_CLIENT_ID: web-investor
      # Cookies are shared across ports on localhost, so each app needs its own cookie name.
      SESSION_COOKIE_NAME: pdfe_session_web_investor
      OIDC_CLIENT_SECRET: demo-secret-web-investor
      SESSION_SECRET: ${SESSION_SECRET:-demo-session-secret-synthetic-do-not-reuse-0000}
    depends_on:
      api: { condition: service_healthy }
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://localhost:3005/ar/sign-in').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 20

  web-devportal:
    networks: [app]
    build:
      context: ..
      dockerfile: infra/docker/node-app.Dockerfile
      target: web
      args: { APP: web-devportal }
    environment:
      PORT: '3006'
      HOSTNAME: 0.0.0.0
      API_BASE_URL: http://api:4000
      APP_BASE_URL: http://localhost:3006
      OIDC_ISSUER: http://keycloak:8080/realms/pdfe-demo
      OIDC_PUBLIC_ISSUER: http://localhost:8080/realms/pdfe-demo
      OIDC_CLIENT_ID: web-devportal
      # Cookies are shared across ports on localhost, so each app needs its own cookie name.
      SESSION_COOKIE_NAME: pdfe_session_web_devportal
      OIDC_CLIENT_SECRET: demo-secret-web-devportal
      SESSION_SECRET: ${SESSION_SECRET:-demo-session-secret-synthetic-do-not-reuse-0000}
    depends_on:
      api: { condition: service_healthy }
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://localhost:3006/ar/sign-in').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 20

  # The only container with a route to the outside. It publishes the apps on the loopback interface and
  # forwards to services on the internal network.
  gateway:
    image: caddy:2
    networks: [app, edge]
    ports:
      - '127.0.0.1:3001:3001'
      - '127.0.0.1:3002:3002'
      - '127.0.0.1:3003:3003'
      - '127.0.0.1:3004:3004'
      - '127.0.0.1:3005:3005'
      - '127.0.0.1:3006:3006'
      - '127.0.0.1:3000:3000'
      - '127.0.0.1:4000:4000'
      - '127.0.0.1:8080:8080'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      api: { condition: service_healthy }
      keycloak: { condition: service_healthy }
      lgtm: { condition: service_healthy }
      web-consumer: { condition: service_healthy }
      web-merchant: { condition: service_healthy }
      web-business: { condition: service_healthy }
      web-console: { condition: service_healthy }
      web-investor: { condition: service_healthy }
      web-devportal: { condition: service_healthy }
    healthcheck:
      test: ['CMD', 'wget', '-q', '--spider', 'http://127.0.0.1:2019/config/']
      interval: 5s
      timeout: 3s
      retries: 20

networks:
  # No route to the internet: containers on this network can only reach each other.
  app:
    internal: true
  edge: {}

volumes:
  pgdata: {}
