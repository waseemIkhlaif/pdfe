# Label flow: the simulation banner is on the send tab, in Arabic (FR-022, SC-011).
# The text is the label of the language and nothing else; the other language's label is not shown.
appId: org.pdfe.demo
name: label-send-ar
---
- launchApp:
    clearState: true
- openLink: pdfe://?lang=ar
- tapOn:
    id: tab-send
- assertVisible:
    id: simulation-banner
- assertVisible: 'محاكاة — ليست أموالاً حقيقية'
- assertNotVisible: 'SIMULATION — NOT REAL MONEY'
