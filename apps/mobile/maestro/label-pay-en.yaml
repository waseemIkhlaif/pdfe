# Label flow: the simulation banner is on the pay tab, in English (FR-022, SC-011).
# The text is the label of the language and nothing else; the other language's label is not shown.
# The label strings are written with \u escapes, so this file is plain ASCII and Maestro reads it the
# same whatever the default character set of the machine is.
appId: org.pdfe.demo
name: label-pay-en
---
- launchApp:
    clearState: true
# Wait until the app has started: a link that arrives while it is still starting is dropped.
- assertVisible:
    id: simulation-banner
- openLink: pdfe://?lang=en
- tapOn:
    id: tab-pay
- assertVisible:
    id: simulation-banner
- assertVisible: "SIMULATION \u2014 NOT REAL MONEY"
- assertNotVisible: "\u0645\u062D\u0627\u0643\u0627\u0629 \u2014 \u0644\u064A\u0633\u062A \u0623\u0645\u0648\u0627\u0644\u0627\u064B \u062D\u0642\u064A\u0642\u064A\u0629"
